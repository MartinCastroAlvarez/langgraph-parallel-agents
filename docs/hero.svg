<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#38bdf8"/>
    </marker>
    <style>
      text { font-family: "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
      .t { fill: #e2e8f0; font-size: 21px; }
      .s { fill: #94a3b8; font-size: 16px; }
      .box { fill: #111a33; stroke: #38bdf8; stroke-width: 2; }
      .dim { fill: #111a33; stroke: #334155; stroke-width: 2; }
      .e { stroke: #38bdf8; stroke-width: 2.5; fill: none; marker-end: url(#a); }
      .ed { stroke: #38bdf8; stroke-width: 2.5; fill: none; stroke-dasharray: 7 6; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1280" height="640" fill="#0b1020"/>

  <text x="80" y="110" fill="#f8fafc" font-size="56" font-weight="700">langgraph-parallel-agents</text>
  <text x="80" y="160" fill="#94a3b8" font-size="25">Fan-out with Send, fan-in with reducers: map-reduce, sectioning and voting in LangGraph.</text>

  <!-- planner -->
  <rect class="box" x="80" y="330" width="190" height="78" rx="14"/>
  <text class="t" x="175" y="365" text-anchor="middle">planner</text>
  <text class="s" x="175" y="390" text-anchor="middle">question → N</text>

  <!-- Send label -->
  <text x="352" y="250" fill="#38bdf8" font-size="18" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">Send(…) × N</text>

  <!-- fan-out edges -->
  <path class="ed" d="M270 369 C 330 369, 340 262, 430 262"/>
  <path class="ed" d="M270 369 L 430 369"/>
  <path class="ed" d="M270 369 C 330 369, 340 476, 430 476"/>

  <!-- researchers -->
  <rect class="box" x="432" y="228" width="320" height="68" rx="14"/>
  <text class="t" x="460" y="270">researcher 0</text>
  <text class="s" x="605" y="270">agent ⇄ search</text>
  <rect class="box" x="432" y="335" width="320" height="68" rx="14"/>
  <text class="t" x="460" y="377">researcher 1</text>
  <text class="s" x="605" y="377">agent ⇄ search</text>
  <rect class="dim" x="432" y="442" width="320" height="68" rx="14"/>
  <text x="460" y="484" fill="#64748b" font-size="21">researcher 2</text>
  <text x="605" y="484" fill="#f87171" font-size="16">failed → isolated</text>

  <text class="s" x="592" y="548" text-anchor="middle">max_concurrency · RetryPolicy · TimeoutPolicy</text>

  <!-- fan-in edges -->
  <path class="e" d="M752 262 C 815 262, 815 369, 868 369"/>
  <path class="e" d="M752 369 L 868 369"/>
  <path class="e" d="M752 476 C 815 476, 815 369, 868 369" stroke-opacity="0.35"/>

  <!-- reducer -->
  <rect class="box" x="870" y="322" width="140" height="94" rx="14"/>
  <text class="t" x="940" y="358" text-anchor="middle">reducer</text>
  <text x="940" y="386" fill="#38bdf8" font-size="15" text-anchor="middle" font-family="DejaVu Sans Mono, monospace">operator.add</text>

  <path class="e" d="M1010 369 L 1060 369"/>

  <!-- synthesizer -->
  <rect class="box" x="1062" y="330" width="150" height="78" rx="14"/>
  <text class="t" x="1137" y="365" text-anchor="middle">synthesize</text>
  <text class="s" x="1137" y="390" text-anchor="middle">cited answer</text>

  <text x="80" y="600" fill="#64748b" font-size="18">Runs 100% locally on ollama · no paid APIs required</text>
  <text x="1200" y="600" fill="#64748b" font-size="18" text-anchor="end">8.2× faster at 16 branches</text>
</svg>
