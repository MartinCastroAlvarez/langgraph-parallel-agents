[tool.poetry]
name = "langgraph-parallel-agents"
version = "0.1.0"
description = "Parallel agents in LangGraph: a map-reduce research desk (Send fan-out to tool-using researcher subgraphs, reducer fan-in, cited synthesis), sectioning and voting, with bounded concurrency, per-branch retries, timeouts and failure isolation, streamed progress and a wall-clock benchmark. Runs 100% locally on ollama."
authors = ["Martín Castro Álvarez <martincastro.10.5@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/MartinCastroAlvarez/langgraph-parallel-agents"
repository = "https://github.com/MartinCastroAlvarez/langgraph-parallel-agents"
documentation = "https://github.com/MartinCastroAlvarez/langgraph-parallel-agents#readme"
keywords = [
    "langgraph",
    "langchain",
    "ai-agents",
    "multi-agent-systems",
    "map-reduce",
    "parallelization",
    "send-api",
    "ollama",
    "local-llm",
    "agentic-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
packages = [{ include = "parallel_agents" }]
include = [
    { path = "LICENSE", format = ["sdist", "wheel"] },
]

[tool.poetry.scripts]
parallel-agents = "parallel_agents.cli:main"
parallel-agents-bench = "parallel_agents.bench:main"

[tool.poetry.dependencies]
python = "^3.11"
langgraph = ">=1.2.17,<2"
langchain-core = ">=1.7,<2"
langchain-ollama = ">=1.1,<2"
langchain-anthropic = { version = ">=1.7,<2", optional = true }

[tool.poetry.extras]
anthropic = ["langchain-anthropic"]

[tool.poetry.group.dev.dependencies]
pytest = "^9.0"
pytest-cov = ">=5,<8"
ruff = ">=0.6"
mypy = "^1.11 || ^2.0"
bandit = "^1.7"
pip-audit = "^2.7"

[build-system]
requires = ["poetry-core>=1.6.0"]
build-backend = "poetry.core.masonry.api"

# --------------------------------------------------------------------------- #
# Ruff - lint + format
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",       # pycodestyle
    "F",            # pyflakes
    "I",            # isort
    "B",            # bugbear
    "S",            # bandit-style security
    "UP",           # pyupgrade
    "SIM",          # simplify
    "RET",          # returns
    "PIE",          # misc
    "ASYNC",        # async pitfalls
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S311", "E501"]
"examples/**/*.py" = ["S101"]
"scripts/**/*.py" = ["S603", "S404", "E501"]

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = ["parallel_agents", "tests", "examples"]

# --------------------------------------------------------------------------- #
# Pytest
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
python_files = ["test_*.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=parallel_agents",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
filterwarnings = ["error"]

# --------------------------------------------------------------------------- #
# MyPy
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
plugins = ["pydantic.mypy"]

# --------------------------------------------------------------------------- #
# Coverage
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["parallel_agents"]

[tool.coverage.report]
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
omit = [
    "parallel_agents/__main__.py",
]

# --------------------------------------------------------------------------- #
# Bandit
# --------------------------------------------------------------------------- #
[tool.bandit]
exclude_dirs = ["tests", "examples", "scripts", ".venv", "build", "dist"]
